version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - dupl
    - err113
    - forbidigo
    - goconst
    - godot
    - godox
    - goprintffuncname
    - gocritic
    - gosec
    - misspell
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        - exitAfterDefer
    forbidigo:
      forbid:
        # Logging via Print bypasses our logging framework.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)
        - pattern: ^panic.*$
  exclusions:
    rules:
      # Tests may use dynamic errors and be repetitive.
      - path: _test\.go
        linters:
          - err113
          - dupl
          - goconst

formatters:
  enable:
    - goimports
